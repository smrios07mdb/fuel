<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fuel</title>
<meta name="theme-color" content="#0B0C0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fuel">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0C0A;--s1:#131411;--s2:#1B1D18;--line:#272A23;--line2:#383C32;
  --text:#ECEBE4;--mut:#A0A296;--faint:#959889;--dim:#6A6D61;
  --acc:#D6F25F;--accbg:rgba(214,242,95,.14);--mint:#8FE3B6;--blue:#A9C8F0;--cream:#EAE0C4;
  --warn:#F2994A;--warnbg:#2A1C0E;--warnline:#5C3F22;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
}
/* Type scale: 12 / 13 / 15 / 17 in sans, 22 / 40 / 56 in serif. Nothing below 12. Mono is for numbers only.
   --faint is the lowest-contrast text colour (6.3:1 on cards); --dim is for decoration, never text. */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:17px;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:var(--text)}
#app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 104px)}
.micro{font-size:12px;font-weight:600;color:var(--mut);letter-spacing:.01em}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num.big{font-size:17px;margin-top:6px}
.fnt{color:var(--faint);font-family:var(--sans);font-size:13px}
.okc{color:var(--mint)}
h1{font-family:var(--serif);font-weight:400;font-size:40px;line-height:1;margin:4px 0 0;letter-spacing:-.01em}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:16px}
.datenav{display:flex;align-items:center;gap:4px;flex:none}
.datenav button{width:44px;height:44px;border:1px solid var(--line2);border-radius:12px;font-size:22px;line-height:1;color:var(--mut)}
.datenav .tick{font-size:17px;font-weight:600}
.datenav .tick.on{background:var(--mint);border-color:var(--mint);color:#10120A}
.back{display:inline-flex;align-items:center;min-height:44px;margin:-10px 0 -6px;font-size:15px;font-weight:600;color:var(--acc)}
.sec{margin-bottom:28px}
.sech{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.sech .t{font-size:17px;font-weight:600;margin:0;color:var(--text)}
.sech .r{margin-left:auto;font-size:13px;color:var(--mut);text-align:right}
.subtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.subtop .h{font-family:var(--serif);font-size:22px;line-height:1.1;margin-top:2px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:14px}
.sum{display:flex;gap:16px;align-items:center;margin-bottom:12px}
.sum .sl{flex:none;min-width:112px}
.sum .left{font-family:var(--serif);font-size:56px;line-height:.9}
.sum .left.over,#pin b.over{color:var(--warn)}
.sum .lu{font-size:15px;font-weight:600;margin-top:6px}
.sum .of{font-size:13px;color:var(--faint);margin-top:3px}
.macros{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.mrow .l{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.mrow .v{font-family:var(--mono);font-size:15px}
.mrow .v small{color:var(--faint);font-size:12px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
#pin{position:fixed;left:0;right:0;top:0;z-index:6;background:rgba(11,12,10,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 9px) 16px 9px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;transform:translateY(-110%);transition:transform .18s}
#pin.on{transform:none}
#pin b{font-size:15px;font-weight:600;white-space:nowrap}
#pin span{font-family:var(--mono);font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alert{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;border:1px solid var(--warnline);background:var(--warnbg);border-radius:14px;margin-bottom:8px}
.alert .ai{flex:none;width:22px;height:22px;border-radius:50%;background:var(--warn);color:#10120A;font-size:15px;font-weight:600;line-height:22px;text-align:center}
.alert .at{flex:1;min-width:0;font-size:15px;line-height:1.3;color:var(--text)}
.alert .at b{display:block;color:var(--warn);font-weight:600}
.alert .btn.sm{background:var(--bg)}
.alert .btn.sm.pri{background:var(--acc)}
.alert.soft{border-color:var(--line2);background:none}
.alert.soft .at{padding:6px 0}
.okline{display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--mut);margin:0 2px 10px;line-height:1.4}
.okline b{color:var(--mint);font-weight:600}
.status{margin-bottom:12px}
.quick{margin-bottom:10px}
.slot{margin-bottom:10px}
.sloth{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px}
.sloth .nm{font-family:var(--serif);font-size:22px;line-height:1}
.sloth .k{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--mut)}
.plus{width:48px;height:48px;border-radius:12px;background:var(--s2);border:1px solid var(--line2);color:var(--acc);font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;flex:none}
.slot .card{padding:0;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 14px;border-top:1px solid var(--line);min-height:56px}
.row .nm{flex:1;min-width:0;font-size:17px;line-height:1.25}
.row .nm small{display:block;font-size:13px;color:var(--faint);margin-top:3px;line-height:1.3}
.row .k{font-family:var(--mono);font-size:15px;color:var(--text);flex:none;text-align:right}
.row .k small{display:block;font-family:var(--sans);color:var(--faint);font-size:12px;margin-top:2px}
.row .chev{flex:none;color:var(--faint);font-size:22px;line-height:1;width:12px;text-align:center}
.row.grp[aria-expanded=true] .chev{transform:rotate(90deg)}
.row.sub{background:var(--s2);padding-left:26px;min-height:52px}
.row.sub .nm{font-size:15px}
.row.rm{justify-content:center;font-size:13px;font-weight:600;color:var(--warn);min-height:44px}
.list .row:first-child{border-top:0}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line2);font-size:15px;font-weight:600;color:var(--text);text-align:center;line-height:1.15}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#10120A}
.btn.dan{color:var(--warn);border-color:var(--warnline)}
.btn.full{width:100%}
.btn:disabled{opacity:.5}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1;padding:0 8px}
.btn.sm{min-height:44px;padding:0 12px;font-size:13px;flex:none}
.btns .btn.sm{flex:1;padding:0 6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--mut)}
.chip.on{color:#10120A;background:var(--mint);border-color:var(--mint)}
.chip.warn{color:var(--warn);border-color:var(--warnline)}
.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.field input,.field select,.inp{width:100%;height:48px;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:17px;font-family:var(--mono);outline:none;-webkit-appearance:none;appearance:none}
.field input:focus,.inp:focus,.field select:focus{border-color:var(--acc)}
.inp.txt,.field input.txt,.field select{font-family:var(--sans)}
.field textarea{width:100%;height:132px;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.45;font-family:var(--mono);color:var(--text);outline:none;resize:none;-webkit-appearance:none;appearance:none}
.field textarea:focus{border-color:var(--acc)}
.row .nm small.bad,.wflag{color:var(--warn)}
.note{font-size:13px;line-height:1.5;color:var(--mut);margin:0}
.note.warn{color:var(--warn)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stack{display:flex;flex-direction:column;gap:12px}
.inline{display:flex;gap:8px;align-items:flex-end}
.inline .btn{min-height:48px}
.seg{display:flex;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;min-height:44px;border-radius:9px;font-size:13px;font-weight:600;color:var(--mut);padding:0 2px}
.seg button.on{background:var(--line2);color:var(--text)}
.empty{padding:18px 14px;font-size:15px;line-height:1.4;color:var(--faint);text-align:center}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0;padding-top:0}
.kv:last-child{padding-bottom:0}
.kv .v{font-family:var(--mono);font-size:15px;text-align:right;white-space:nowrap}
.kv .k{font-size:15px;color:var(--mut)}
.herorow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hero{font-family:var(--serif);font-size:56px;line-height:1}
.hero small{font-family:var(--sans);font-size:15px;font-weight:600;color:var(--mut);margin-left:6px}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(11,12,10,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav>div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr;align-items:center;padding:0 6px}
nav button[data-t]{height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--faint);position:relative}
nav .ni{width:56px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc)}
nav button.on .ni{background:var(--accbg)}
nav .fab{justify-self:center;width:56px;height:56px;border-radius:18px;background:var(--acc);color:#10120A;display:flex;align-items:center;justify-content:center;margin-top:-18px;box-shadow:0 0 0 5px var(--bg)}
nav .fab svg{width:28px;height:28px;stroke-width:2.2}
#nb{position:absolute;top:5px;left:50%;margin-left:12px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--warn);color:#10120A;font-size:12px;font-weight:600;line-height:20px;text-align:center;display:none;box-shadow:0 0 0 2px var(--bg)}
#nb.on{display:block}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--s1);border-top:1px solid var(--line2);border-radius:20px 20px 0 0;max-height:92dvh;max-height:92vh;display:none;flex-direction:column;max-width:520px;margin:0 auto}
body.sheet #scrim{display:block}
body.sheet #sheet{display:flex}
.shh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 10px;flex:none}
.shh .ttl{font-family:var(--serif);font-size:22px;line-height:1.1;margin-top:2px}
.shb{padding:6px 16px calc(env(safe-area-inset-bottom) + 18px);overflow-y:auto;-webkit-overflow-scrolling:touch}
.x{width:44px;height:44px;border-radius:12px;border:1px solid var(--line2);color:var(--mut);font-size:17px;flex:none}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 92px);background:var(--text);color:#10120A;font-size:13px;font-weight:600;line-height:1.3;padding:11px 14px;border-radius:12px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center;display:flex;align-items:center;gap:12px}
#toast.on{opacity:1}
#toast.on.act{pointer-events:auto}
#toast button{min-height:44px;margin:-11px -6px -11px 0;padding:0 10px;font-size:13px;font-weight:600;text-decoration:underline}
.chart{position:relative;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto}
.tip{position:absolute;top:0;background:var(--s2);border:1px solid var(--line2);border-radius:8px;padding:6px 8px;font-family:var(--mono);font-size:12px;pointer-events:none;white-space:nowrap;display:none}
.mealitem{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.mealitem:first-child{border-top:0}
.mealitem .nm{flex:1;min-width:0;font-size:15px;line-height:1.25}
.mealitem input{width:84px;height:46px;background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:0 10px;font-size:17px;font-family:var(--mono);text-align:right}
.mealitem .u{font-size:13px;color:var(--faint);width:12px}
details{border-top:1px solid var(--line)}
details summary{font-size:15px;font-weight:600;line-height:20px;padding:12px 0;color:var(--text);cursor:pointer}
details ol{padding-left:22px;margin:0 0 14px;font-size:15px;line-height:1.5;color:var(--mut)}
details code{font-family:var(--mono);font-size:13px;color:var(--text);background:var(--s2);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}
.row.split{padding:0;gap:0}
.row.split .main{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left;padding:10px 8px 10px 14px;min-height:56px}
.q{flex:none;margin-right:8px;min-height:44px;min-width:56px;padding:0 10px;border-radius:10px;border:1px solid var(--line2);font-family:var(--mono);font-size:13px;color:var(--acc);white-space:nowrap}
.row.ghost .nm{color:var(--mut)}
.row.ghost .nm small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.ghost .k{color:var(--mut)}
.row:disabled .wd,.row:disabled .k{color:var(--faint)}
.wd{font-size:13px;font-weight:600;color:var(--mut);width:36px;flex:none}
.dbar{flex:1;min-width:0}
.dbar small{display:block;font-size:12px;margin-top:5px}
</style>
</head>
<body>
<div id="app"></div>
<div id="pin" aria-hidden="true"></div>
<nav><div>
  <button data-a="tab" data-t="today"><span class="ni"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></span>Today<i id="nb"></i></button>
  <button data-a="tab" data-t="foods"><span class="ni"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16a8 8 0 0 1-16 0zM9 8c0-1.6 1.2-2 1.2-3.6M14 8c0-1.6 1.2-2 1.2-3.6"/></svg></span>Foods</button>
  <button class="fab" data-a="navAdd" aria-label="Log food"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-a="tab" data-t="progress"><span class="ni"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l5-5 4 3 7-8M15 7h5v5"/></svg></span>Progress</button>
  <button data-a="tab" data-t="settings"><span class="ni"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></svg></span>Settings</button>
</div></nav>
<div id="scrim" data-a="close"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>
<div id="toast"></div>
<script>
'use strict';
/* ---------- helpers ---------- */
const LS='fuel.v1', SLOTS=['Breakfast','Lunch','Dinner','Snacks'], KG_PER_LB=0.45359237, OZ=28.3495, KCAL_PER_KG=7700;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const z2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+z2(d.getMonth()+1)+'-'+z2(d.getDate());
const parseD=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(k,n)=>{const d=parseD(k);d.setDate(d.getDate()+n);return ymd(d)};
const dayDiff=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const today=()=>ymd(new Date());
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isFinite(n)?n:0};
const r0=n=>Math.round(n), r1=n=>Math.round(n*10)/10;
const fmt=n=>r0(n).toLocaleString('en-US');
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const niceDate=k=>parseD(k).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const shortDate=k=>parseD(k).toLocaleDateString('en-US',{month:'short',day:'numeric'});

/* ---------- state ---------- */
function seed(){
  const f=(name,kcal,p,c,f_,serving)=>({id:uid(),name,kcal,p,c,f:f_,serving:serving||null,src:'seed'});
  const foods=[
    f('Oats, rolled, dry',379,13.2,67.7,6.5),
    f('Raspberries',52,1.2,11.9,0.7),
    f('Mixed berries, frozen',50,0.8,12,0.4),
    f('Chia seeds',486,16.5,42.1,30.7),
    f('Almond milk, unsweetened',15,0.6,0.6,1.2),
    f('Yogurt, plain, whole milk',61,3.5,4.7,3.3),
    f('Protein powder, whey',400,80,8,6,{label:'scoop',g:30}),
    f('Egg, whole',143,12.6,0.7,9.5,{label:'large egg',g:50}),
    f('Bacon, cooked',468,34,1.7,35,{label:'strip',g:8}),
    f('Chicken breast, cooked',165,31,0,3.6),
    f('Ground beef 90/10, cooked',217,26.1,0,11.8),
    f('Ground turkey 93/7, cooked',213,27.1,0,11.6),
    f('Pasta, cooked',158,5.8,30.9,0.9),
    f('Brown rice, cooked',123,2.7,25.6,1),
    f('Arugula',25,2.6,3.7,0.7)
  ];
  const id=n=>foods.find(x=>x.name.startsWith(n)).id;
  const meals=[
    {id:uid(),name:'Oats bowl',items:[['Oats',50],['Raspberries',100],['Mixed berries',50],['Chia',20],['Almond milk',70],['Yogurt',60],['Protein powder',30]].map(([n,g])=>({foodId:id(n),g}))},
    {id:uid(),name:'Eggs and bacon',items:[{foodId:id('Egg'),g:150},{foodId:id('Bacon'),g:16}]},
    {id:uid(),name:'Chicken and rice',items:[{foodId:id('Chicken'),g:227},{foodId:id('Brown rice'),g:225}]},
    {id:uid(),name:'Beef and pasta',items:[{foodId:id('Ground beef'),g:227},{foodId:id('Pasta'),g:225}]}
  ];
  return {v:1,foods,meals,days:[],meta:{lastBackup:0,snooze:''},log:{},weights:{},health:{},body:{},
    targets:{kcal:2600,p:190,c:290,f:75,mode:'g',pp:30,pc:45,pf:25,goal:'custom',goalKg:0},
    profile:{sex:'m',age:35,heightCm:178,activity:1.55},
    settings:{unit:'lb',usdaKey:'',branded:false}};
}
let S,fresh=false,snapT=0;
function load(){
  try{S=JSON.parse(localStorage.getItem(LS))}catch(e){S=null}
  if(!S||!S.foods){S=seed();fresh=true;save()}

  S=j;save();load();ui.recover=null;closeSheet();render();toast('Restored snapshot from '+snapWhen(rec));
}

/* what fits: recent foods and saved meals that fit the kcal left, best protein cover first */
function fits(k){
  const t=sum(entries(k)),T=S.targets,L=T.kcal-t.kcal,P=Math.max(0,T.p-t.p),out=[];
  if(L<50)return {L,P,out};
  const used=usage(null),pool=used.length?used:S.foods.filter(f=>f.serving);
  pool.forEach((f,i)=>{
    if(!(f.kcal>0))return;
    const g0=lastGrams(f.id)||(f.serving?f.serving.g:100);let g=g0;
    if(P>=5&&f.p*4/f.kcal>=0.4)g=clamp(P/f.p*100,g0*0.5,g0*1.5); // protein-dense: size the portion to the protein gap
    g=Math.min(g,L/f.kcal*100);
    g=f.serving&&f.serving.g>0?Math.floor(g/f.serving.g+0.05)*f.serving.g:(g>=20?Math.floor(g/5)*5:Math.floor(g));
    if(g<=0||g<g0*0.4)return;
    const e=mkEntry(f,g);if(e.kcal>L*1.03)return;
    out.push({f,g,kcal:e.kcal,p:e.p,c:e.c,fat:e.f,rank:i});
  });
  S.meals.forEach(m=>{
    if(!mealItems(m).length)return;const ms=mealSum(m),scale=ms.kcal<=L?1:ms.kcal/2<=L?0.5:0;if(!scale||!ms.kcal)return;
    out.push({m,scale,kcal:ms.kcal*scale,p:ms.p*scale,c:ms.c*scale,fat:ms.f*scale,rank:1.5});
  });
  const cover=o=>P>=5?Math.round(Math.min(1,o.p/P)*5):0;
  out.sort((a,b)=>cover(b)-cover(a)||a.rank-b.rank);
  return {L,P,out:out.slice(0,4)};
}

/* recipes: raw ingredients plus the cooked weight of the batch, saved as an ingredient per 100 g cooked */
function recipeCalc(m){ // m: {items:[{foodId,g}],yield}
  const its=m.items.filter(i=>food(i.foodId)),t=sum(its.map(i=>mkEntry(food(i.foodId),i.g))),raw=its.reduce((a,i)=>a+i.g,0),y=m.yield>0?m.yield:raw,sc=y?100/y:0;
  return {t,raw,y,per:{kcal:t.kcal*sc,p:t.p*sc,c:t.c*sc,f:t.f*sc}};
}
function recalcRecipes(){ // an ingredient changed: refresh recipes built from it (past entries keep what they were logged with)
  for(const f of S.foods){
    const r=f.recipe;if(!r||!r.items.length||!r.items.every(i=>food(i.foodId)))continue;
    const c=recipeCalc(r);if(!c.y)continue;f.kcal=r1(c.per.kcal);f.p=r1(c.per.p);f.c=r1(c.per.c);f.f=r1(c.per.f);
  }
}

/* goal weight: projected date from the 28-day weight trend and from the plan */
const longDate=k=>parseD(k).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
function goalInfo(){
  const T=S.targets,td=tdee(),lw=latestWeight(),avg=avgW(today()),cur=avg!==null?avg:(lw?lw.kg:null),g=GOALS.find(x=>x[0]===T.goal);
  const o={goal:T.goalKg||0,cur,isAvg:avg!==null,rate:td.kgPerDay,plan:g&&g[2]!==null?g[2]/KCAL_PER_KG:null,pct:null};
  if(cur&&o.rate!==null)o.pct=-o.rate*7/cur*100;
  const eta=r=>{

    const days=Math.ceil(rem/r);return days>730?{far:true}:{days,date:addDays(today(),days)};

}

let chartPts=[],chartUnit='',chartLabel='';
function chart(){

    const px=best.x/340*b.width;tip.style.left=clamp(px-tip.offsetWidth/2,0,b.width-tip.offsetWidth)+'px'};

  return fs.length?fs.map(f=>foodRow(f,'pickFood')).join(''):'<div class="empty">No foods match.</div>';

async function usdaSearch(){
  const p=ctx.pick,q=p.q.trim();if(!q)return;
  p.msg='Searching…';p.usda=[];$('#plist').innerHTML=pickerList();
  const types=['Foundation','SR Legacy'].concat(S.settings.branded?['Branded']:[]);
  const url='https://api.nal.usda.gov/fdc/v1/foods/search?api_key='+encodeURIComponent(S.settings.usdaKey.trim()||'DEMO_KEY')+'&pageSize=30&query='+encodeURIComponent(q)+'&dataType='+encodeURIComponent(types.join(','));
  try{
    const r=await fetch(url);
    if(r.status===429)throw new Error('Rate limit reached. Add your own key in Settings.');
    if(r.status===403)throw new Error('USDA rejected the API key. Check it in Settings.');
    if(!r.ok)throw new Error('USDA search failed ('+r.status+').');
    const j=await r.json();p.usda=(j.foods||[]).map(parseUsda).filter(f=>f.kcal>0||f.p+f.c+f.f>0);
    p.msg=p.usda.length?'':'No results.';
  }catch(e){p.msg=e.message&&!/fetch/i.test(e.message)?e.message:'Could not reach USDA. Check your connection.'}
  if(ctx.pick===p&&$('#plist'))$('#plist').innerHTML=pickerList();
}
function parseUsda(f){
  const n={};for(const x of f.foodNutrients||[])if(x.nutrientId!=null&&n[x.nutrientId]==null)n[x.nutrientId]=x.value;
  const p=n[1003]||0,c=n[1005]||0,fat=n[1004]||0;
  const kcal=n[1008]??n[2047]??n[2048]??(4*p+4*c+9*fat);
  const title=s=>s.charAt(0)+s.slice(1).toLowerCase();
  let name=f.description||'Food';if(name===name.toUpperCase())name=title(name);
  if(f.brandName||f.brandOwner)name+=' ('+(f.brandName||f.brandOwner)+')';
  const u=String(f.servingSizeUnit||'').toLowerCase();
  const serving=f.servingSize&&(u==='g'||u==='grm')?{label:'serving',g:f.servingSize}:null;
  return {name,kcal:r1(kcal),p:r1(p),c:r1(c),f:r1(fat),serving,src:'usda',fdcId:f.fdcId};
}
function saveUsda(u){
  let f=S.foods.find(x=>x.fdcId&&x.fdcId===u.fdcId);
  if(!f){f=Object.assign({id:uid()},u);S.foods.push(f);save()}
  return f;
}

    const pasted=$('#hp').value.trim();
    if(pasted){const r=parseHealth(pasted);if(!r.n&&!r.w)return toast('Could not read that text')}
    else{const k=$('#hd').value,a=num($('#ha').value),r=num($('#hr').value);if(!k||a+r<=0)return toast('Enter active and resting kcal');S.health[k]={active:r0(a),resting:r0(r)};save()}
    closeSheet();render();toast('Saved');
  },
  async export(){
    const prev=S.meta.lastBackup,done=()=>{save();render();toast('Backup saved')};
    S.meta.lastBackup=Date.now(); // stamped into the file too, so a restore knows its own age
    const name='fuel-backup-'+today()+'.json',blob=new Blob([JSON.stringify(S)],{type:'application/json'});
    try{const file=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return done()}}catch(e){if(e&&e.name==='AbortError'){S.meta.lastBackup=prev;return}}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();done();
  },
  import(){$('#imp').click()},
  navAdd(){ui.tab='today';ui.date=today();ui.sp=null;window.scrollTo(0,0);render();openPicker('log',slotNow())},
  pslot(d){ctx.pick.slot=d.s;drawPicker()},
  grp(d){ui.open=ui.open===d.key?null:d.key;render()},
  grpDel(d,el){if(!twoTap(el,'gd'+d.g,'Tap again to remove'))return;const dd=day(ui.date),old=dd.entries;dd.entries=old.filter(e=>!(e.slot===d.slot&&e.group===d.g));save();render();toast(d.g+' removed',()=>{dd.entries=old;save();render()})},
  skip(){const d=day(ui.date);d.skip=[...new Set((d.skip||[]).concat(missing(ui.date).filter(c=>c.kind==='m').map(c=>c.slot)))];save();render();toast('Marked as skipped')},
  weigh(d){openWeigh(d.k)},
  wAll(){ui.wAll=!ui.wAll;render()},
  pv(d){ui.pv=d.v;window.scrollTo(0,0);render()},
  sp(d){ui.sp=d.p||null;window.scrollTo(0,0);render()},
  editGoal(){ui.tab='settings';ui.sp='targets';window.scrollTo(0,0);render()},
  undo(){const f=toast.undo;toast.undo=null;clearTimeout(toast.t);$('#toast').classList.remove('on');if(f)f()},
  async reset(d,el){if(!twoTap(el,'reset','Tap again to erase everything'))return;try{await snapshot('before erase')}catch(e){}localStorage.removeItem(LS);load();render();toast('Erased')}
};
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]');if(!el||el.disabled)return;const fn=A[el.dataset.a];if(fn)fn(el.dataset,el)});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='fq'){ui.q=t.value;$('#flist').innerHTML=foodsList()}
  else if(t.id==='pq'){ctx.pick.q=t.value;if(ctx.pick.tab!=='usda')$('#plist').innerHTML=pickerList()}
  else if(t.id==='pl'){ctx.paste.text=t.value;$('#plout').innerHTML=pasteOut()}
  else if(t.id==='amt'){ctx.amt.val=t.value;$('#aout').innerHTML=amtOut()}
  else if(t.dataset.ml!=null){ctx.ml.items[+t.dataset.ml].g=num(t.value);$('#mlout').innerHTML=mlOut()}
  else if(t.dataset.mi!=null||t.id==='ry'||t.id==='rp'){syncMeal();$('#mout').innerHTML=mealOut()} // totals update in place: a redraw here would swallow the tap on Save
});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='pq'&&ctx.pick&&ctx.pick.tab==='usda'){ev.preventDefault();usdaSearch()}});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='imp'&&t.files[0]){const rd=new FileReader();rd.onload=async()=>{let j;try{j=JSON.parse(rd.result);if(!Array.isArray(j.foods)||typeof j.log!=='object')throw 0}catch(e){return toast('Not a Fuel backup file')}try{await snapshot('before import')}catch(e){}S=j;save();load();render();toast('Backup restored')};rd.readAsText(t.files[0]);t.value='';return}
  if(t.dataset.mi!=null)return;
  if(!t.dataset.set)return;
  const[a,b]=t.dataset.set.split('.');
  S[a][b]=t.dataset.bool?t.value==='1':t.dataset.str?t.value.trim():num(t.value);save();
  if(a==='targets'&&b==='kcal'&&S.targets.goal!=='custom'){S.targets.goal='custom';save();render();return}
  if(a==='targets'){if(S.targets.mode==='pct'){applyPct();save()}const n=$('#macronote');if(n)n.textContent=targetNote()}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(snapT);snapshot().catch(()=>{})}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ui.tab==='today'&&!document.body.classList.contains('sheet')&&ui.date!==today()&&ui._seen!==today()){ui._seen=today();ui.date=today();render()}});

load();render();
(navigator.storage&&navigator.storage.persist?navigator.storage.persist().catch(()=>{}):Promise.resolve()).then(snapInfo);
if(fresh)snapList().then(sn=>{if(sn.length&&!hasData()){ui.recover=sn[0];if(ui.tab==='today'&&!document.body.classList.contains('sheet'))render()}}).catch(()=>{});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
