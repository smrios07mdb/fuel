<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fuel</title>
<meta name="theme-color" content="#0B0C0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0C0A;--s1:#131411;--s2:#1B1D18;--line:#272A23;--line2:#383C32;
  --text:#ECEBE4;--mut:#A0A296;--faint:#6A6D61;
  --acc:#D6F25F;--mint:#8FE3B6;--blue:#A9C8F0;--cream:#EAE0C4;--warn:#F2994A;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:var(--text)}
#app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 92px)}
.micro{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1{font-family:var(--serif);font-weight:400;font-size:40px;line-height:1;margin:6px 0 0;letter-spacing:-.01em}
.top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.datenav{display:flex;align-items:center;gap:4px}
.datenav button{width:40px;height:40px;border:1px solid var(--line);border-radius:10px;font-size:18px;color:var(--mut)}
.datenav button:disabled{opacity:.3}
.sec{margin-bottom:28px}
.sech{display:flex;align-items:baseline;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.sech .n{font-family:var(--mono);font-size:10px;color:var(--acc);letter-spacing:.1em}
.sech .t{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--text)}
.sech .r{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--mut)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:14px}
.energy{display:flex;gap:16px;align-items:center}
.ring{position:relative;width:128px;height:128px;flex:none}
.ring svg{width:128px;height:128px;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .big{font-family:var(--serif);font-size:34px;line-height:1}
.macros{flex:1;display:flex;flex-direction:column;gap:11px;min-width:0}
.mrow .l{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.mrow .v{font-family:var(--mono);font-size:12px}
.mrow .v small{color:var(--faint);font-size:11px}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat .v{font-family:var(--mono);font-size:16px;margin-top:4px}
.stat .v small{font-size:10px;color:var(--faint)}
.slot{margin-bottom:10px}
.sloth{display:flex;align-items:center;gap:10px;padding:12px 14px}
.sloth .nm{font-family:var(--serif);font-size:22px;line-height:1}
.sloth .k{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--mut)}
.plus{width:36px;height:36px;border-radius:10px;background:var(--acc);color:#10120A;font-size:22px;line-height:1;font-weight:500;display:flex;align-items:center;justify-content:center;flex:none}
.slot .card{padding:0;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 14px;border-top:1px solid var(--line);min-height:48px}
.row .nm{flex:1;min-width:0;font-size:15px;line-height:1.25}
.row .nm small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:3px;letter-spacing:.02em}
.row .k{font-family:var(--mono);font-size:13px;color:var(--text);flex:none;text-align:right}
.row .k small{display:block;color:var(--faint);font-size:10.5px;margin-top:2px}
.list .row:first-child{border-top:0}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:11px;border:1px solid var(--line2);font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#10120A;font-weight:500}
.btn.dan{color:var(--warn);border-color:#4a3320}
.btn.full{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:5px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--mut)}
.chip.on{color:#10120A;background:var(--mint);border-color:var(--mint)}
.chip.warn{color:var(--warn);border-color:#4a3320}
.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.field input,.field select,.inp{width:100%;height:46px;background:var(--s2);border:1px solid var(--line);border-radius:11px;padding:0 12px;font-size:16px;font-family:var(--mono);outline:none;-webkit-appearance:none;appearance:none}
.field input:focus,.inp:focus,.field select:focus{border-color:var(--acc)}
.inp.txt,.field input.txt{font-family:var(--sans)}
.field textarea{width:100%;height:132px;background:var(--s2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:13px;line-height:1.45;font-family:var(--mono);color:var(--text);outline:none;resize:none;-webkit-appearance:none;appearance:none}
.field textarea:focus{border-color:var(--acc)}
.row .nm small.bad{color:var(--warn)}
.note.warn{color:var(--warn)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stack{display:flex;flex-direction:column;gap:12px}
.inline{display:flex;gap:8px;align-items:flex-end}
.seg{display:flex;background:var(--s2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{flex:1;min-height:38px;border-radius:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.seg button.on{background:var(--line2);color:var(--text)}
.note{font-size:13px;line-height:1.45;color:var(--mut)}
.empty{padding:18px 14px;font-size:14px;color:var(--faint);text-align:center}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0;padding-top:0}
.kv .v{font-family:var(--mono);font-size:14px;text-align:right}
.kv .k{font-size:14px;color:var(--mut)}
.hero{font-family:var(--serif);font-size:56px;line-height:1}
.hero small{font-family:var(--mono);font-size:12px;color:var(--mut);letter-spacing:.1em;margin-left:6px}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(11,12,10,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav div{max-width:520px;margin:0 auto;display:flex}
nav button{flex:1;height:60px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);position:relative}
nav button.on{color:var(--acc)}
nav button.on:before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:2px;background:var(--acc)}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--s1);border-top:1px solid var(--line2);border-radius:20px 20px 0 0;max-height:92dvh;max-height:92vh;display:none;flex-direction:column;max-width:520px;margin:0 auto}
body.sheet #scrim{display:block}
body.sheet #sheet{display:flex}
.shh{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px;flex:none}
.shh .ttl{font-family:var(--serif);font-size:26px;line-height:1.05}
.shb{padding:6px 16px calc(env(safe-area-inset-bottom) + 18px);overflow-y:auto;-webkit-overflow-scrolling:touch}
.x{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);color:var(--mut);font-size:18px;flex:none}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 12px);background:var(--text);color:#10120A;font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:10px 14px;border-radius:10px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
#toast.on{opacity:1}
.chart{position:relative;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto}
.tip{position:absolute;top:0;background:var(--s2);border:1px solid var(--line2);border-radius:8px;padding:6px 8px;font-family:var(--mono);font-size:11px;pointer-events:none;white-space:nowrap;display:none}
.mealitem{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.mealitem:first-child{border-top:0}
.mealitem .nm{flex:1;min-width:0;font-size:14px}
.mealitem input{width:84px;height:42px;background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:0 10px;font-size:16px;font-family:var(--mono);text-align:right}
.mealitem .u{font-family:var(--mono);font-size:11px;color:var(--faint);width:12px}
details{border-top:1px solid var(--line);padding:12px 0}
details summary{font-size:14px;color:var(--text);cursor:pointer}
details ol{padding-left:20px;margin:10px 0 0;font-size:13.5px;line-height:1.5;color:var(--mut)}
details code{font-family:var(--mono);font-size:12px;color:var(--text);background:var(--s2);padding:1px 5px;border-radius:5px}
.notice{display:flex;align-items:center;gap:8px;padding:9px 9px 9px 14px;border:1px solid var(--line2);border-radius:12px;margin-bottom:8px;font-size:13.5px;line-height:1.3}
.notice span{flex:1;min-width:0}
.notices{margin:-8px 0 20px}
.btn.sm{min-height:38px;padding:0 11px;font-size:10px;letter-spacing:.1em;flex:none}
.row.split{padding:0;gap:0}
.row.split .main{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left;padding:11px 8px 11px 14px;min-height:48px}
.q{flex:none;margin-right:10px;min-height:38px;min-width:44px;padding:0 10px;border-radius:9px;border:1px solid var(--line2);font-family:var(--mono);font-size:11px;color:var(--acc);white-space:nowrap}
.row.ghost .nm{color:var(--mut)}
.row.ghost .nm small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.ghost .k{color:var(--mut)}
.row:disabled{opacity:.35}
.wd{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);width:36px;flex:none}
.dbar{flex:1;min-width:0}
nav button{letter-spacing:.08em;font-size:9.5px}
</style>
</head>
<body>
<div id="app"></div>
<nav><div>
  <button data-a="tab" data-t="today">Today</button>
  <button data-a="tab" data-t="foods">Foods</button>
  <button data-a="tab" data-t="weight">Weight</button>
  <button data-a="tab" data-t="week">Week</button>
  <button data-a="tab" data-t="settings">Settings</button>
</div></nav>
<div id="scrim" data-a="close"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>
<div id="toast"></div>
<script>
'use strict';
/* ---------- helpers ---------- */
const LS='fuel.v1', SLOTS=['Breakfast','Lunch','Dinner','Snacks'], KG_PER_LB=0.45359237, OZ=28.3495, KCAL_PER_KG=7700;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const z2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+z2(d.getMonth()+1)+'-'+z2(d.getDate());
const parseD=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(k,n)=>{const d=parseD(k);d.setDate(d.getDate()+n);return ymd(d)};
const dayDiff=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const today=()=>ymd(new Date());
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isFinite(n)?n:0};
const r0=n=>Math.round(n), r1=n=>Math.round(n*10)/10;
const fmt=n=>r0(n).toLocaleString('en-US');
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const niceDate=k=>parseD(k).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const shortDate=k=>parseD(k).toLocaleDateString('en-US',{month:'short',day:'numeric'});

/* ---------- state ---------- */
function seed(){
  const f=(name,kcal,p,c,f_,serving)=>({id:uid(),name,kcal,p,c,f:f_,serving:serving||null,src:'seed'});
  const foods=[
    f('Oats, rolled, dry',379,13.2,67.7,6.5),
    f('Raspberries',52,1.2,11.9,0.7),
    f('Mixed berries, frozen',50,0.8,12,0.4),
    f('Chia seeds',486,16.5,42.1,30.7),
    f('Almond milk, unsweetened',15,0.6,0.6,1.2),
    f('Yogurt, plain, whole milk',61,3.5,4.7,3.3),
    f('Protein powder, whey',400,80,8,6,{label:'scoop',g:30}),
    f('Egg, whole',143,12.6,0.7,9.5,{label:'large egg',g:50}),
    f('Bacon, cooked',468,34,1.7,35,{label:'strip',g:8}),
    f('Chicken breast, cooked',165,31,0,3.6),
    f('Ground beef 90/10, cooked',217,26.1,0,11.8),
    f('Ground turkey 93/7, cooked',213,27.1,0,11.6),
    f('Pasta, cooked',158,5.8,30.9,0.9),
    f('Brown rice, cooked',123,2.7,25.6,1),
    f('Arugula',25,2.6,3.7,0.7)
  ];
  const id=n=>foods.find(x=>x.name.startsWith(n)).id;
  const meals=[
    {id:uid(),name:'Oats bowl',items:[['Oats',50],['Raspberries',100],['Mixed berries',50],['Chia',20],['Almond milk',70],['Yogurt',60],['Protein powder',30]].map(([n,g])=>({foodId:id(n),g}))},
    {id:uid(),name:'Eggs and bacon',items:[{foodId:id('Egg'),g:150},{foodId:id('Bacon'),g:16}]},
    {id:uid(),name:'Chicken and rice',items:[{foodId:id('Chicken'),g:227},{foodId:id('Brown rice'),g:225}]},
    {id:uid(),name:'Beef and pasta',items:[{foodId:id('Ground beef'),g:227},{foodId:id('Pasta'),g:225}]}
  ];
  return {v:1,foods,meals,days:[],meta:{lastBackup:0,snooze:''},log:{},weights:{},health:{},
    targets:{kcal:2600,p:190,c:290,f:75,mode:'g',pp:30,pc:45,pf:25,goal:'custom',goalKg:0},
    profile:{sex:'m',age:35,heightCm:178,activity:1.55},
    settings:{unit:'lb',usdaKey:'',branded:false}};
}
let S,fresh=false,snapT=0;
function load(){
  try{S=JSON.parse(localStorage.getItem(LS))}catch(e){S=null}
  if(!S||!S.foods){S=seed();fresh=true;save()}
  const d=seed();
  for(const k of ['targets','profile','settings','meta'])S[k]=Object.assign({},d[k],S[k]||{});
  for(const k of ['log','weights','health'])S[k]=S[k]||{};
  S.meals=S.meals||[];S.days=S.days||[];
}
function save(){
  try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast('Could not save: storage full or blocked')}
  clearTimeout(snapT);snapT=setTimeout(()=>snapshot().catch(()=>{}),1500);
}
const monday=k=>addDays(k,-((parseD(k).getDay()+6)%7));
const ui={tab:'today',date:today(),seg:'foods',q:'',range:90,week:monday(today()),gen:false};

/* ---------- domain ---------- */
const food=id=>S.foods.find(f=>f.id===id);
const day=k=>S.log[k]||(S.log[k]={entries:[],complete:false});
const entries=k=>(S.log[k]&&S.log[k].entries)||[];
const sum=es=>es.reduce((t,x)=>({kcal:t.kcal+x.kcal,p:t.p+x.p,c:t.c+x.c,f:t.f+x.f}),{kcal:0,p:0,c:0,f:0});
const mkEntry=(f,g,slot,group)=>({id:uid(),slot,foodId:f.id,name:f.name,g,kcal:f.kcal*g/100,p:f.p*g/100,c:f.c*g/100,f:f.f*g/100,group:group||''});
const cloneEntry=(e,slot)=>{const f=food(e.foodId);return f?mkEntry(f,e.g,slot||e.slot,e.group):{...e,id:uid(),slot:slot||e.slot}};
const dayKcal=k=>sum(entries(k)).kcal;
const isComplete=k=>!!(S.log[k]&&S.log[k].complete&&entries(k).length);
const mealItems=m=>m.items.filter(i=>food(i.foodId));
const mealSum=m=>sum(mealItems(m).map(i=>mkEntry(food(i.foodId),i.g)));
const healthTotal=k=>{const h=S.health[k];return h?(h.active||0)+(h.resting||0):0};
const wUnit=()=>S.settings.unit;
const toDisp=kg=>wUnit()==='lb'?kg/KG_PER_LB:kg;
const fromDisp=v=>wUnit()==='lb'?v*KG_PER_LB:v;
function latestWeight(){const ks=Object.keys(S.weights).sort();return ks.length?{k:ks[ks.length-1],kg:S.weights[ks[ks.length-1]]}:null}
function formulaTdee(){
  const w=latestWeight(),p=S.profile;if(!w||!p.heightCm||!p.age)return 0;
  return (10*w.kg+6.25*p.heightCm-5*p.age+(p.sex==='f'?-161:5))*p.activity;
}
function slope(pts){ // least squares, returns y per x
  const n=pts.length;if(n<2)return 0;const mx=mean(pts.map(p=>p[0])),my=mean(pts.map(p=>p[1]));
  let a=0,b=0;for(const[x,y]of pts){a+=(x-mx)*(y-my);b+=(x-mx)*(x-mx)}return b?a/b:0;
}
const MIN_COMPLETE=10, WINDOW=28;
function tdee(){
  const end=today(),days=[];for(let i=WINDOW-1;i>=0;i--)days.push(addDays(end,-i));
  const last7=days.slice(-7).map(healthTotal).filter(v=>v>0);
  const health7=mean(last7);
  const complete=days.filter(k=>S.log[k]&&S.log[k].complete&&entries(k).length&&healthTotal(k)>0);
  const wpts=days.map((k,i)=>S.weights[k]!=null?[i,S.weights[k]]:null).filter(Boolean);
  const span=wpts.length?wpts[wpts.length-1][0]-wpts[0][0]:0;
  const kgPerDay=wpts.length>=5&&span>=10?slope(wpts):null;
  const intake=mean(complete.map(k=>sum(entries(k)).kcal));
  const healthC=mean(complete.map(healthTotal));
  let factor=null,calibrated=false;
  if(complete.length>=MIN_COMPLETE&&kgPerDay!==null&&healthC>0){
    factor=clamp((intake-kgPerDay*KCAL_PER_KG)/healthC,0.7,1.3);calibrated=true;
  }
  const formula=formulaTdee();
  const best=calibrated&&health7?health7*factor:(health7||formula);
  const source=calibrated&&health7?'Calibrated':(health7?'Apple Health, uncalibrated':(formula?'Formula estimate':''));
  return {health7,healthDays:last7.length,complete:complete.length,weighIns:wpts.length,wSpan:span,kgPerDay,intake,factor,calibrated,formula,best,source};
}
function usage(slot){ // foods logged before: most frequent in this slot over 30 days first, then most recent
  const from=addDays(today(),-30),cnt={},last={};
  for(const k of Object.keys(S.log).sort())for(const e of entries(k)){if(!food(e.foodId))continue;last[e.foodId]=k;if(k>=from&&(!slot||e.slot===slot))cnt[e.foodId]=(cnt[e.foodId]||0)+1}
  return Object.keys(last).map(food).sort((a,b)=>(cnt[b.id]||0)-(cnt[a.id]||0)||last[b.id].localeCompare(last[a.id])).slice(0,30);
}
function usualMeals(slot){ // saved meals logged in this slot in the last 30 days, most frequent first
  const from=addDays(today(),-30),cnt={};
  for(const k of Object.keys(S.log))if(k>=from){const seen=new Set(entries(k).filter(e=>e.slot===slot&&e.group).map(e=>e.group));for(const g of seen)cnt[g]=(cnt[g]||0)+1}
  return S.meals.filter(m=>cnt[m.name]&&mealItems(m).length).sort((a,b)=>cnt[b.name]-cnt[a.name]).slice(0,3);
}
function lastSlot(slot,before){ // most recent earlier day with something logged in this slot
  const ks=Object.keys(S.log).filter(k=>k<before).sort();
  for(let i=ks.length-1;i>=0;i--){const es=entries(ks[i]).filter(e=>e.slot===slot);if(es.length){const names=[...new Set(es.map(e=>e.group||e.name))];return {k:ks[i],kcal:sum(es).kcal,label:names.slice(0,2).join(', ')+(names.length>2?' +'+(names.length-2):'')}}}

}
function kcalByFood(days){const from=addDays(today(),-days+1),m={};for(const k of Object.keys(S.log))if(k>=from)for(const e of entries(k))m[e.foodId]=(m[e.foodId]||0)+e.kcal;return m}
function genericFoods(){const m=kcalByFood(30);return S.foods.filter(isEst).sort((a,b)=>(m[b.id]||0)-(m[a.id]||0)||a.name.localeCompare(b.name))}
function relog(f){ // push corrected macros into past entries (usual days recompute when logged)
  let n=0;const fix=e=>{if(e.foodId!==f.id)return;e.name=f.name;e.kcal=f.kcal*e.g/100;e.p=f.p*e.g/100;e.c=f.c*e.g/100;e.f=f.f*e.g/100;n++};

}
/* backup */
const DAY_MS=864e5;
const backupAge=()=>S.meta.lastBackup?Math.floor((Date.now()-S.meta.lastBackup)/DAY_MS):null;
function backupDue(){const a=backupAge(),has=Object.keys(S.log).some(k=>entries(k).length)||Object.keys(S.weights).length>0;return has&&(a===null||a>=7)&&S.meta.snooze!==today()}
function lastGrams(fid){const ks=Object.keys(S.log).sort().reverse();for(const k of ks){const es=entries(k);for(let i=es.length-1;i>=0;i--)if(es[i].foodId===fid)return es[i].g}return 0}
function readHealth(text){ // lines: yyyy-MM-dd active=N resting=N weight=N (any subset), or two bare numbers for yesterday
  const out=[],NUM='(\\d+(?:[.,]\\d+)?)';
  for(const line of String(text).split(/\r?\n/)){
    if(!line.trim()||line.includes('|'))continue;
    const dm=line.match(/\d{4}-\d{2}-\d{2}/),k=dm?dm[0]:addDays(today(),-1);
    if(k>today())continue;
    let rest=line.replace(/\d{4}-\d{2}-\d{2}/,' ');const o={k};
    const wm=rest.match(new RegExp('weight\\s*[=:]?\\s*'+NUM+'\\s*(kg|kilograms?|lbs?|pounds?)?','i'));
    const hasW=/weight/i.test(rest);
    if(wm){
      const v=num(wm[1]),u=(wm[2]||'').toLowerCase(),kg=u?(u[0]==='k'?v:v*KG_PER_LB):fromDisp(v);
      if(kg>=25&&kg<=320)o.kg=Math.round(kg*1000)/1000;
      rest=rest.replace(wm[0],' ');
    }
    rest=rest.replace(/weight\s*[=:]?/i,' ');
    const a=rest.match(new RegExp('active\\s*[=:]?\\s*'+NUM,'i')),r=rest.match(new RegExp('resting\\s*[=:]?\\s*'+NUM,'i'));
    let active=0,resting=0;
    if(a||r){active=a?num(a[1]):0;resting=r?num(r[1]):0}
    else if(!hasW&&!/active|resting/i.test(rest)){ // bare form: exactly two numbers and nothing else, so stray clipboard text is never read as burn
      const m=rest.match(new RegExp('^[\\s,;:]*'+NUM+'[\\s,;/]+'+NUM+'[\\s,;]*$'));
      if(m&&num(m[1])+num(m[2])>=500){active=num(m[1]);resting=num(m[2])}
    }
    if(active+resting>0&&active+resting<=20000){o.active=r0(active);o.resting=r0(resting)}
    if(o.kg!=null||o.active!=null)out.push(o);
  }
  return out;
}
function applyHealth(rows){ // returns {n: burn days, w: weigh-ins}
  let n=0,w=0;
  for(const o of rows){if(o.kg!=null){S.weights[o.k]=o.kg;w++}if(o.active!=null){S.health[o.k]={active:o.active,resting:o.resting};n++}}
  if(n||w)save();return {n,w};
}
const parseHealth=text=>applyHealth(readHealth(text));
const healthMsg=r=>'Imported '+[r.n?r.n+' day'+(r.n>1?'s':'')+' of burn':'',r.w?r.w+' weigh-in'+(r.w>1?'s':''):''].filter(Boolean).join(' and ');

/* paste log: one food per line, slot | name | amount | kcal=N p=N c=N f=N (macros are for the amount eaten) */
const SLOT_ALIAS={b:'Breakfast',breakfast:'Breakfast',l:'Lunch',lunch:'Lunch',d:'Dinner',dinner:'Dinner',s:'Snacks',snack:'Snacks',snacks:'Snacks'};
const slotNow=()=>{const h=new Date().getHours();return h<11?'Breakfast':h<15?'Lunch':h<17?'Snacks':h<22?'Dinner':'Snacks'};
const isEst=f=>f.src==='seed'||f.src==='est';
const toks=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9%]+/g,' ').trim().split(' ').filter(Boolean).map(w=>w.length>3&&w.endsWith('s')?w.slice(0,-1):w);
function findByName(list,name,fuzzy){ // exact first; then a single item whose words contain (or are contained in) the pasted words
  const t=toks(name);if(!t.length)return null;const key=t.join(' ');
  const ex=list.find(x=>toks(x.name).join(' ')===key);if(ex||!fuzzy)return ex||null;
  const a=list.filter(x=>{const n=toks(x.name);return t.every(w=>n.includes(w))});if(a.length===1)return a[0];if(a.length)return null;
  const b=list.filter(x=>{const n=toks(x.name);return n.every(w=>t.includes(w))});return b.length===1?b[0]:null;
}
function parseLog(text,base){
  const out=[],N='(\\d+(?:[.,]\\d+)?)';let k=base;
  const mac=(s,keys)=>{const m=s.match(new RegExp('(?:^|[\\s,;])(?:'+keys+')\\s*[=:]\\s*'+N,'i'));return m?num(m[1]):null};
  for(let line of String(text).split(/\r?\n/)){
    line=line.replace(/[`*]/g,'').replace(/^\s*(?:[-•–]|\d+[.)])\s+/,'').trim();if(!line)continue;
    const dm=line.match(/^(?:date\s*[=:]?\s*)?(\d{4}-\d{2}-\d{2}|today|yesterday)\s*:?$/i);
    if(dm){const v=dm[1].toLowerCase(),d=v==='today'?today():v==='yesterday'?addDays(today(),-1):v;if(d<=today())k=d;continue}
    if(!line.includes('|'))continue;
    const parts=line.split('|').map(x=>x.trim());while(parts.length&&!parts[0])parts.shift();while(parts.length&&!parts[parts.length-1])parts.pop();
    if(!parts.length||/^[-: ]+$/.test(parts.join(''))||/^(slot|meal)$/i.test(parts[0]))continue;
    let slot=SLOT_ALIAS[parts[0].toLowerCase()]||null;if(slot)parts.shift();
    const name=(parts.shift()||'').replace(/\s+/g,' ');if(!name)continue;
    const it={k,slot:slot||slotNow(),name,kind:'err',msg:''};out.push(it);
    const amt=parts.length&&!/[=:]/.test(parts[0])?parts.shift():'',tail=' '+parts.join(' ');
    const am=amt.match(new RegExp('^'+N+'\\s*(.*)$'));let g=0,cnt=0;
    if(am){const v=num(am[1]),u=am[2].toLowerCase();
      if(!u||/^(g|gr|grams?|ml)$/.test(u))g=v;else if(/^(oz|ounces?)$/.test(u))g=v*OZ;else if(/^(kg|kilograms?)$/.test(u))g=v*1000;else if(/^(lbs?|pounds?)$/.test(u))g=v*1000*KG_PER_LB;else cnt=v}
    const meal=findByName(S.meals.filter(m=>mealItems(m).length),name,false);
    if(meal&&!g){it.kind='meal';it.ref=meal;it.scale=cnt||1;const t=mealSum(meal);it.g=0;for(const x of ['kcal','p','c','f'])it[x]=t[x]*it.scale;continue}
    let kc=mac(tail,'kcal|cal|cals|calories');const pr=mac(tail,'p|pro|protein'),cb=mac(tail,'c|carb|carbs'),ft=mac(tail,'f|fat|fats');
    const given=!(kc===null&&pr===null&&cb===null&&ft===null),P=pr||0,C=cb||0,F=ft||0;if(given&&kc===null)kc=4*P+4*C+9*F;
    const fits=gg=>gg>0&&!(kc*100/gg>900||(P+C+F)>gg*1.02);
    const f=findByName(S.foods,name,true);
    if(f){
      if(!g&&cnt){if(f.serving)g=cnt*f.serving.g;else{it.msg='Needs grams: no serving size saved';continue}}
      if(!g)g=lastGrams(f.id)||(f.serving?f.serving.g:0);
      if(g<=0||g>5000){it.msg='Amount missing';continue}
      Object.assign(it,mkEntry(f,g),{kind:'food',ref:f,name:f.name,slot:it.slot});
      if(given&&fits(g))Object.assign(it,{kcal:kc,p:P,c:C,f:F,own:true}); // pasted macros win for this entry; the library is untouched
      continue;
    }
    if(!given){it.msg='Not in your ingredients and no macros given';continue}
    if(g<=0||g>5000){it.msg='New food needs an amount in grams';continue}
    if(!fits(g)){it.msg='Macros do not fit '+r0(g)+' g';continue}
    Object.assign(it,{kind:'new',g,kcal:kc,p:P,c:C,f:F,name:name.charAt(0).toUpperCase()+name.slice(1)});
  }

}
function commitLog(items){ // returns {n: entries added, nf: new ingredients}
  let n=0,nf=0;
  for(const it of items){
    if(it.kind==='meal'){const es=mealItems(it.ref).filter(i=>i.g>0).map(i=>mkEntry(food(i.foodId),r1(i.g*it.scale),it.slot,it.ref.name));day(it.k).entries.push(...es);n+=es.length}
    else if(it.kind==='food'){const e=mkEntry(it.ref,r1(it.g),it.slot);if(it.own)Object.assign(e,{kcal:it.kcal,p:it.p,c:it.c,f:it.f});day(it.k).entries.push(e);n++}
    else if(it.kind==='new'){
      let f=findByName(S.foods,it.name,false);
      if(!f){const s=100/it.g;f={id:uid(),name:it.name,kcal:r1(it.kcal*s),p:r1(it.p*s),c:r1(it.c*s),f:r1(it.f*s),serving:null,src:'est'};S.foods.push(f);nf++}

/* snapshots: rolling copies in IndexedDB, one per day plus one before each erase, import or restore */
const SNAP_AUTO=7,SNAP_PRE=3;
const hasData=()=>Object.keys(S.log).some(k=>entries(k).length)||Object.keys(S.weights).length>0||Object.keys(S.health).length>0;
function idb(mode,fn){
  return new Promise((res,rej)=>{
    let rq;try{rq=indexedDB.open('fuel',1)}catch(e){return rej(e)}
    rq.onupgradeneeded=()=>rq.result.createObjectStore('snaps',{keyPath:'k'});
    rq.onerror=()=>rej(rq.error);
    rq.onsuccess=()=>{const db=rq.result;let out;
      try{const tx=db.transaction('snaps',mode);out=fn(tx.objectStore('snaps'));tx.oncomplete=()=>{db.close();res(out&&out.result)};tx.onerror=tx.onabort=()=>{db.close();rej(tx.error)}}
      catch(e){db.close();rej(e)}};
  });
}
const snapList=async()=>((await idb('readonly',st=>st.getAll()))||[]).sort((a,b)=>b.t-a.t);
async function snapshot(why){
  if(!hasData())return;
  const rec={k:why?'pre-'+Date.now():'auto-'+today(),t:Date.now(),why:why||'',days:Object.keys(S.log).filter(k=>entries(k).length).length,data:JSON.stringify(S)};
  await idb('readwrite',st=>st.put(rec));
  const all=await snapList(),drop=all.filter(x=>x.why).slice(SNAP_PRE).concat(all.filter(x=>!x.why).slice(SNAP_AUTO));
  if(drop.length)await idb('readwrite',st=>{drop.forEach(x=>st.delete(x.k))});
  snapInfo();
}
async function snapInfo(){
  try{ui.snaps=await snapList()}catch(e){ui.snaps=null}
  try{ui.persisted=navigator.storage&&navigator.storage.persisted?await navigator.storage.persisted():null}catch(e){ui.persisted=null}
  const el=$('#snapinfo');if(el)el.innerHTML=snapKv();
}
const snapWhen=x=>shortDate(ymd(new Date(x.t)))+', '+new Date(x.t).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
async function restoreSnap(rec){
  let j;try{j=JSON.parse(rec.data);if(!Array.isArray(j.foods)||typeof j.log!=='object')throw 0}catch(e){return toast('That snapshot cannot be read')}
  try{await snapshot('before restore')}catch(e){}
  S=j;save();load();ui.recover=null;closeSheet();render();toast('Restored snapshot from '+snapWhen(rec));
}

/* what fits: recent foods and saved meals that fit the kcal left, best protein cover first */
function fits(k){
  const t=sum(entries(k)),T=S.targets,L=T.kcal-t.kcal,P=Math.max(0,T.p-t.p),out=[];
  if(L<50)return {L,P,out};
  const used=usage(null),pool=used.length?used:S.foods.filter(f=>f.serving);
  pool.forEach((f,i)=>{
    if(!(f.kcal>0))return;
    const g0=lastGrams(f.id)||(f.serving?f.serving.g:100);let g=g0;
    if(P>=5&&f.p*4/f.kcal>=0.4)g=clamp(P/f.p*100,g0*0.5,g0*1.5); // protein-dense: size the portion to the protein gap
    g=Math.min(g,L/f.kcal*100);
    g=f.serving&&f.serving.g>0?Math.floor(g/f.serving.g+0.05)*f.serving.g:(g>=20?Math.floor(g/5)*5:Math.floor(g));
    if(g<=0||g<g0*0.4)return;
    const e=mkEntry(f,g);if(e.kcal>L*1.03)return;
    out.push({f,g,kcal:e.kcal,p:e.p,c:e.c,fat:e.f,rank:i});
  });
  S.meals.forEach(m=>{
    if(!mealItems(m).length)return;const ms=mealSum(m),scale=ms.kcal<=L?1:ms.kcal/2<=L?0.5:0;if(!scale||!ms.kcal)return;
    out.push({m,scale,kcal:ms.kcal*scale,p:ms.p*scale,c:ms.c*scale,fat:ms.f*scale,rank:1.5});
  });
  const cover=o=>P>=5?Math.round(Math.min(1,o.p/P)*5):0;
  out.sort((a,b)=>cover(b)-cover(a)||a.rank-b.rank);
  return {L,P,out:out.slice(0,4)};
}

/* recipes: raw ingredients plus the cooked weight of the batch, saved as an ingredient per 100 g cooked */
function recipeCalc(m){ // m: {items:[{foodId,g}],yield}
  const its=m.items.filter(i=>food(i.foodId)),t=sum(its.map(i=>mkEntry(food(i.foodId),i.g))),raw=its.reduce((a,i)=>a+i.g,0),y=m.yield>0?m.yield:raw,sc=y?100/y:0;
  return {t,raw,y,per:{kcal:t.kcal*sc,p:t.p*sc,c:t.c*sc,f:t.f*sc}};
}
function recalcRecipes(){ // an ingredient changed: refresh recipes built from it (past entries keep what they were logged with)
  for(const f of S.foods){
    const r=f.recipe;if(!r||!r.items.length||!r.items.every(i=>food(i.foodId)))continue;
    const c=recipeCalc(r);if(!c.y)continue;f.kcal=r1(c.per.kcal);f.p=r1(c.per.p);f.c=r1(c.per.c);f.f=r1(c.per.f);
  }
}

/* goal weight: projected date from the 28-day weight trend and from the plan */
const longDate=k=>parseD(k).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
function goalInfo(){
  const T=S.targets,td=tdee(),lw=latestWeight(),avg=avgW(today()),cur=avg!==null?avg:(lw?lw.kg:null),g=GOALS.find(x=>x[0]===T.goal);
  const o={goal:T.goalKg||0,cur,isAvg:avg!==null,rate:td.kgPerDay,plan:g&&g[2]!==null?g[2]/KCAL_PER_KG:null,pct:null};
  if(cur&&o.rate!==null)o.pct=-o.rate*7/cur*100;
  const eta=r=>{
    if(!o.goal||cur===null||r===null)return null;const rem=o.goal-cur;
    if(Math.abs(rem)<0.25)return {done:true};
    if(Math.abs(r)<0.004||Math.sign(r)!==Math.sign(rem))return {away:true};
    const days=Math.ceil(rem/r);return days>730?{far:true}:{days,date:addDays(today(),days)};
  };
  o.trendEta=eta(o.rate);o.planEta=eta(o.plan);return o;
}
const etaText=e=>!e?'—':e.done?'At goal':e.away?'Not heading there':e.far?'Over 2 years':longDate(e.date)+' · '+(e.days<14?e.days+' d':Math.round(e.days/7)+' wk');

/* week summary as plain text, for pasting into Claude */
function weekText(start){
  const s=weekStats(start),T=S.targets,td=s.td,u=wUnit(),dp=u==='lb'?1:2,f=td.calibrated?td.factor:1;
  const pace=kg=>kg===null?'n/a':signed(toDisp(kg),dp)+' '+u+'/wk',pl=(n,w)=>n+' '+w+(n===1?'':'s');
  const gname=(GOALS.find(x=>x[0]===T.goal)||[])[1]||'Custom',a=avgW(s.end),b=avgW(addDays(start,-1)),gi=goalInfo(),L=[];
  L.push('Fuel week summary: '+longDate(start)+' to '+longDate(s.all[6])+' ('+s.days.length+' of 7 days elapsed)');
  L.push('Goal: '+gname+' · target '+fmt(T.kcal)+' kcal, P '+r0(T.p)+' / C '+r0(T.c)+' / F '+r0(T.f)+' g · estimated TDEE '+(td.best?fmt(td.best)+' ('+td.source+')':'n/a'));
  L.push('Intake: '+(s.intake!==null?'avg '+fmt(s.intake)+' kcal on '+pl(s.comp.length,'complete day')+', '+signedK(s.intake-T.kcal)+' vs target · protein avg '+r0(s.protein)+' g':'no complete days'));
  if(s.intakeAll!==null)L.push('All logged days incl. open: avg '+fmt(s.intakeAll)+' kcal over '+pl(s.logged.length,'day'));
  L.push('Burn: '+(s.burn!==null?'avg '+fmt(s.burn)+' kcal/day over '+pl(s.burnDays,'day')+', Apple Health'+(td.calibrated?' × '+td.factor.toFixed(2)+' correction':', uncalibrated'):'no data'));
  L.push('Weight: '+(a!==null?'7-day avg '+r1(toDisp(a))+' '+u+(b!==null?', '+r1(toDisp(b))+' '+u+' at the end of the prior week':''):'not enough weigh-ins for an average')+' · '+pl(s.weighIns,'weigh-in')+' this week');
  L.push('Pace: plan '+pace(s.planKg)+' · implied by intake − burn '+pace(s.expKg)+(s.expKg!==null?' ('+s.bothN+' d)':'')+' · scale '+pace(s.actKg));
  if(gi.goal&&gi.cur!==null)L.push('Goal weight: '+r1(toDisp(gi.goal))+' '+u+', '+signed(toDisp(gi.goal-gi.cur),1)+' '+u+' to go · at 28-day trend ('+pace(gi.rate===null?null:gi.rate*7)+'): '+etaText(gi.trendEta)+' · at plan pace: '+etaText(gi.planEta));
  L.push('Calibration: '+td.complete+' complete days with burn in the last '+WINDOW+' ('+MIN_COMPLETE+' needed) · '+(td.calibrated?'correction × '+td.factor.toFixed(2):'correction pending'));
  L.push('','Days:');
  const by={};let tot=0;
  for(const k of s.days){
    const es=entries(k),t=sum(es),h=healthTotal(k),w=S.weights[k];
    for(const e of es){by[e.name]=(by[e.name]||0)+e.kcal;tot+=e.kcal}
    L.push(parseD(k).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})+': '+(es.length?fmt(t.kcal)+' kcal · P '+r0(t.p)+' C '+r0(t.c)+' F '+r0(t.f):'nothing logged')+' · burn '+(h?fmt(h*f):'n/a')+(w!=null?' · '+r1(toDisp(w))+' '+u:'')+' · '+(isComplete(k)?'complete':es.length?'open':'empty'));
  }
  const top=Object.keys(by).sort((x,y)=>by[y]-by[x]).slice(0,5);
  if(top.length)L.push('','Top foods by kcal: '+top.map(n=>n+' '+fmt(by[n])+' ('+r0(by[n]/tot*100)+'%)').join(', '));
  return L.join('\n');
}

const sech=(n,t,r)=>`<div class="sech"><span class="n">${n}</span><span class="t">${t}</span>${r?`<span class="r">${r}</span>`:''}</div>`;

function weightSeries(){
  const ks=Object.keys(S.weights).sort();const from=ui.range?addDays(today(),-ui.range+1):'0';
  const all=ks.map(k=>({k,v:toDisp(S.weights[k])}));
  for(const p of all){const w=all.filter(o=>o.k<=p.k&&o.k>addDays(p.k,-7));p.avg=mean(w.map(o=>o.v))}

}
let chartPts=[];
function chart(){
  const pts=weightSeries();chartPts=[];
  if(pts.length<2)return `<div class="empty">Log weight on two or more days to see the trend.</div>`;
  const W=340,H=170,L=34,R=44,T=12,B=22;
  const x0=pts[0].k,span=Math.max(1,dayDiff(x0,pts[pts.length-1].k));
  const vs=pts.flatMap(p=>[p.v,p.avg]);let lo=Math.min(...vs),hi=Math.max(...vs);const pad=Math.max(0.5,(hi-lo)*0.15);lo-=pad;hi+=pad;
  const X=k=>L+(W-L-R)*dayDiff(x0,k)/span,Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  chartPts=pts.map(p=>({...p,x:X(p.k),y:Y(p.avg)}));
  const ticks=[lo+(hi-lo)*0.1,(lo+hi)/2,hi-(hi-lo)*0.1];
  const last=pts[pts.length-1];
  return `<div class="chart" id="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend, 7-day average">
  ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(t)+3.5}" text-anchor="end" font-family="var(--mono)" font-size="9" fill="var(--faint)">${r0(t)}</text>`).join('')}
  ${pts.map(p=>`<circle cx="${X(p.k)}" cy="${Y(p.v)}" r="2" fill="var(--faint)"/>`).join('')}
  <polyline points="${pts.map(p=>X(p.k)+','+Y(p.avg)).join(' ')}" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="${X(last.k)}" cy="${Y(last.avg)}" r="4" fill="var(--acc)" stroke="var(--bg)" stroke-width="2"/>
  <text x="${X(last.k)+8}" y="${Y(last.avg)+4}" font-family="var(--mono)" font-size="11" fill="var(--text)">${r1(last.avg)}</text>
  <text x="${L}" y="${H-5}" font-family="var(--mono)" font-size="9" fill="var(--faint)">${shortDate(x0)}</text>
  <text x="${W-R}" y="${H-5}" text-anchor="end" font-family="var(--mono)" font-size="9" fill="var(--faint)">${shortDate(last.k)}</text>
  <line id="cross" y1="${T}" y2="${H-B}" stroke="var(--line2)" stroke-width="1" style="display:none"/>
  <circle id="crossdot" r="4" fill="var(--acc)" stroke="var(--bg)" stroke-width="2" style="display:none"/>
  </svg><div class="tip" id="tip"></div></div>
  <p class="note" style="margin:8px 0 0">Line: 7-day average. Dots: daily weigh-ins. Touch the chart for values.</p>`;
}
function bindChart(){
  const el=$('#chart');if(!el)return;const svg=el.querySelector('svg'),tip=$('#tip'),cr=$('#cross'),dot=$('#crossdot');
  const move=ev=>{const b=svg.getBoundingClientRect(),x=(ev.clientX-b.left)/b.width*340;let best=chartPts[0];for(const p of chartPts)if(Math.abs(p.x-x)<Math.abs(best.x-x))best=p;
    cr.setAttribute('x1',best.x);cr.setAttribute('x2',best.x);cr.style.display='';dot.setAttribute('cx',best.x);dot.setAttribute('cy',best.y);dot.style.display='';
    tip.innerHTML=`${shortDate(best.k)} · ${r1(best.v)} ${wUnit()}<br><span style="color:var(--mut)">7-day avg ${r1(best.avg)}</span>`;tip.style.display='block';
    const px=best.x/340*b.width;tip.style.left=clamp(px-tip.offsetWidth/2,0,b.width-tip.offsetWidth)+'px'};

async function usdaSearch(){
  const p=ctx.pick,q=p.q.trim();if(!q)return;
  p.msg='Searching…';p.usda=[];$('#plist').innerHTML=pickerList();
  const types=['Foundation','SR Legacy'].concat(S.settings.branded?['Branded']:[]);
  const url='https://api.nal.usda.gov/fdc/v1/foods/search?api_key='+encodeURIComponent(S.settings.usdaKey.trim()||'DEMO_KEY')+'&pageSize=30&query='+encodeURIComponent(q)+'&dataType='+encodeURIComponent(types.join(','));
  try{
    const r=await fetch(url);
    if(r.status===429)throw new Error('Rate limit reached. Add your own key in Settings.');
    if(r.status===403)throw new Error('USDA rejected the API key. Check it in Settings.');
    if(!r.ok)throw new Error('USDA search failed ('+r.status+').');
    const j=await r.json();p.usda=(j.foods||[]).map(parseUsda).filter(f=>f.kcal>0||f.p+f.c+f.f>0);
    p.msg=p.usda.length?'':'No results.';
  }catch(e){p.msg=e.message&&!/fetch/i.test(e.message)?e.message:'Could not reach USDA. Check your connection.'}
  if(ctx.pick===p&&$('#plist'))$('#plist').innerHTML=pickerList();
}
function parseUsda(f){
  const n={};for(const x of f.foodNutrients||[])if(x.nutrientId!=null&&n[x.nutrientId]==null)n[x.nutrientId]=x.value;
  const p=n[1003]||0,c=n[1005]||0,fat=n[1004]||0;
  const kcal=n[1008]??n[2047]??n[2048]??(4*p+4*c+9*fat);
  const title=s=>s.charAt(0)+s.slice(1).toLowerCase();
  let name=f.description||'Food';if(name===name.toUpperCase())name=title(name);
  if(f.brandName||f.brandOwner)name+=' ('+(f.brandName||f.brandOwner)+')';
  const u=String(f.servingSizeUnit||'').toLowerCase();
  const serving=f.servingSize&&(u==='g'||u==='grm')?{label:'serving',g:f.servingSize}:null;
  return {name,kcal:r1(kcal),p:r1(p),c:r1(c),f:r1(fat),serving,src:'usda',fdcId:f.fdcId};
}
function saveUsda(u){
  let f=S.foods.find(x=>x.fdcId&&x.fdcId===u.fdcId);
  if(!f){f=Object.assign({id:uid()},u);S.foods.push(f);save()}
  return f;
}

function unitBtns(){const a=ctx.amt;return [['g','Grams'],['oz','Ounces']].concat(a.food.serving?[['srv',a.food.serving.label]]:[]).map(([u,l])=>`<button data-a="aunit" data-u="${u}" class="${a.unit===u?'on':''}">${esc(l)}</button>`).join('')}

function amtOut(){const g=amtGrams(),e=mkEntry(ctx.amt.food,g);return `<div class="kv"><span class="k">${r0(g)} g</span><span class="v">${fmt(e.kcal)} kcal</span></div><div class="kv"><span class="k">Protein · Carbs · Fat</span><span class="v">${r1(e.p)} · ${r1(e.c)} · ${r1(e.f)} g</span></div>`}
/* meal logging */

function mlOut(){const t=sum(ctx.ml.items.map(i=>mkEntry(food(i.foodId),i.g)));return `<div class="kv"><span class="k">Total</span><span class="v">${fmt(t.kcal)} kcal</span></div><div class="kv"><span class="k">Protein · Carbs · Fat</span><span class="v">${r0(t.p)} · ${r0(t.c)} · ${r0(t.f)} g</span></div>`}

/* meal editor */
function openMeal(m){ctx.meal=m?{id:m.id,name:m.name,items:mealItems(m).map(i=>({...i}))}:{name:'',items:[]};drawMeal()}
function drawMeal(){
  const m=ctx.meal;if(m.kind==='recipe')return drawRecipe();
  sheet(m.id?'Edit meal':'New meal',`<div class="stack"><label class="field"><span class="micro">Name</span><input class="txt" id="mn" value="${esc(m.name)}" autocapitalize="sentences"></label>
  <div>${m.items.length?m.items.map((i,ix)=>`<div class="mealitem"><span class="nm">${esc(food(i.foodId).name)}</span><input inputmode="decimal" data-mi="${ix}" value="${r1(i.g)}"><span class="u">g</span><button class="x" data-a="mealRm" data-i="${ix}" aria-label="Remove">✕</button></div>`).join(''):'<div class="empty">No ingredients yet.</div>'}</div>
  <button class="btn full" data-a="mealAdd">Add ingredient</button>
  <div class="card" id="mout">${mealOut()}</div>
  <div class="btns">${m.id?'<button class="btn dan" data-a="mealDel">Delete</button>':''}<button class="btn pri" data-a="mealOk">Save meal</button></div></div>`,'Library');
}
function syncMeal(){
  const m=ctx.meal;if(!m)return;const n=$('#mn');if(n)m.name=n.value;
  document.querySelectorAll('[data-mi]').forEach(i=>{m.items[+i.dataset.mi].g=num(i.value)});
  const y=$('#ry'),pp=$('#rp');if(y)m.yield=num(y.value)||'';if(pp)m.portions=num(pp.value)||'';
}
function mealOut(){
  const m=ctx.meal;
  if(m.kind==='recipe'){
    const r=recipeCalc(m),pg=m.portions>0?r.y/m.portions:0;
    return kv('Batch total',fmt(r.t.kcal)+' kcal · raw '+fmt(r.raw)+' g')+kv('Per 100 g cooked',fmt(r.per.kcal)+' kcal')+kv('Protein · Carbs · Fat',r1(r.per.p)+' · '+r1(r.per.c)+' · '+r1(r.per.f)+' g')+(pg?kv('Per portion · '+r0(pg)+' g',fmt(r.per.kcal*pg/100)+' kcal · P '+r0(r.per.p*pg/100)):'');
  }
  const t=sum(m.items.map(i=>mkEntry(food(i.foodId),i.g)));
  return kv('Total',fmt(t.kcal)+' kcal')+kv('Protein · Carbs · Fat',r0(t.p)+' · '+r0(t.c)+' · '+r0(t.f)+' g');
}
/* recipe editor: shares the meal draft (ctx.meal) so the ingredient picker works for both */
function openRecipe(f){

}
function drawRecipe(){
  const m=ctx.meal;
  sheet(m.id?'Edit recipe':'New recipe',`<div class="stack"><label class="field"><span class="micro">Name</span><input class="txt" id="mn" value="${esc(m.name)}" placeholder="e.g. Turkey chili" autocapitalize="sentences"></label>
  <div class="micro">Raw ingredients</div>
  <div>${m.items.length?m.items.map((i,ix)=>`<div class="mealitem"><span class="nm">${esc(food(i.foodId).name)}</span><input inputmode="decimal" data-mi="${ix}" value="${r1(i.g)}"><span class="u">g</span><button class="x" data-a="mealRm" data-i="${ix}" aria-label="Remove">✕</button></div>`).join(''):'<div class="empty">No ingredients yet.</div>'}</div>
  <button class="btn full" data-a="mealAdd">Add ingredient</button>
  <div class="grid2"><label class="field"><span class="micro">Cooked weight (g)</span><input id="ry" inputmode="decimal" value="${m.yield||''}" placeholder="same as raw"></label><label class="field"><span class="micro">Portions (optional)</span><input id="rp" inputmode="decimal" value="${m.portions||''}"></label></div>
  <div class="card" id="mout">${mealOut()}</div>
  <p class="note" style="margin:0">Weigh the finished batch without the pot. It is saved as an ingredient, so you log it by cooked grams${m.id?'. For a new batch, change the cooked weight; past entries keep the macros they were logged with':''}.</p>
  <div class="btns">${m.id?'<button class="btn dan" data-a="recipeDel">Delete</button>':''}<button class="btn pri" data-a="recipeOk">Save recipe</button></div></div>`,'Library · recipe');
}

function pasteOut(){
  const txt=ctx.paste.text,items=parseLog(txt,ui.date),ok=items.filter(i=>i.kind!=='err'),hs=readHealth(txt);
  if(!items.length&&!hs.length)return txt.trim()?'<div class="empty">Nothing recognised. Log lines: slot | name | amount. Health lines: 2026-10-11 active=612 resting=1890</div>':'';
  const tag={meal:'saved meal',food:'saved ingredient',new:'new · estimate'},t=sum(ok),u=wUnit();
  const hrow=o=>`<div class="row"><span class="nm">Apple Health<small>${shortDate(o.k)}${o.active!=null?' · active '+fmt(o.active)+' · resting '+fmt(o.resting):''}${o.kg!=null&&o.active!=null?' · weight '+r1(toDisp(o.kg))+' '+u:''}</small></span><span class="k">${o.active!=null?fmt(o.active+o.resting)+'<small>kcal burn</small>':r1(toDisp(o.kg))+'<small>'+u+' weigh-in</small>'}</span></div>`;
  const label=ok.length?'Add '+ok.length+' item'+(ok.length>1?'s':'')+' · '+fmt(t.kcal)+' kcal'+(hs.length?' + Health':''):hs.length?'Import Health data':'Nothing to add';
  return `<div class="card list" style="padding:0;overflow:hidden;margin-bottom:12px">${items.map(i=>`<div class="row"><span class="nm">${esc(i.name)}<small class="${i.kind==='err'?'bad':''}">${i.kind==='err'?esc(i.msg):esc(i.slot)+(i.k!==ui.date?' · '+shortDate(i.k):'')+' · '+(i.kind==='meal'?i.scale+'×':r0(i.g)+' g')+' · '+(i.own?'saved · pasted macros':tag[i.kind])}</small></span><span class="k">${i.kind==='err'?'<small>skipped</small>':fmt(i.kcal)+`<small>P ${r0(i.p)} · C ${r0(i.c)} · F ${r0(i.f)}</small>`}</span></div>`).join('')}${hs.map(hrow).join('')}</div>
  <button class="btn pri full" data-a="plOk" ${ok.length||hs.length?'':'disabled'}>${label}</button>`;
}
async function openSnaps(){

function flash(el){const o=el.textContent;el.textContent='✓';el.disabled=true;setTimeout(()=>{if(el.isConnected){el.textContent=o;el.disabled=false}},900)}
let armed=null;
function twoTap(el,key,label){if(armed===key){armed=null;return true}armed=key;el.dataset.orig=el.textContent;el.textContent=label;setTimeout(()=>{if(armed===key){armed=null;if(el.isConnected)el.textContent=el.dataset.orig}},3000);return false}

/* ---------- actions ---------- */
const A={
  tab(d){ui.tab=d.t;ui.q='';window.scrollTo(0,0);render()},

  close(){closeSheet();render()},

  week(d){const k=addDays(ui.week,7*+d.n);if(k>monday(today()))return;ui.week=k;render()},
  gen(){ui.gen=!ui.gen;ui.q='';render()},
  genAll(){ui.tab='foods';ui.seg='foods';ui.gen=true;ui.q='';window.scrollTo(0,0);render()},
  snooze(){S.meta.snooze=today();save();render()},
  quickFood(d,el){const f=food(d.id),g=lastGrams(f.id);if(!g)return openAmount(f);day(ui.date).entries.push(mkEntry(f,g,ctx.pick.slot));save();flash(el);toast(f.name+' added to '+ctx.pick.slot)},

  copySlot(d){const es=entries(d.k).filter(e=>e.slot===d.slot);if(!es.length)return;day(ui.date).entries.push(...es.map(e=>cloneEntry(e)));save();render();toast(d.slot+' copied from '+shortDate(d.k))},
  days(){openDays()},
  daySave(){const es=entries(ui.date);if(!es.length)return;const name=$('#dn').value.trim()||'Usual day '+(S.days.length+1);S.days.push({id:uid(),name,entries:es.map(e=>({slot:e.slot,foodId:e.foodId,name:e.name,g:e.g,kcal:e.kcal,p:e.p,c:e.c,f:e.f,group:e.group||''}))});save();openDays();toast('Saved '+name)},
  dayLog(d){const t=S.days.find(x=>x.id===d.id);if(!t)return;day(ui.date).entries.push(...t.entries.map(e=>cloneEntry(e)));save();closeSheet();render();toast(t.name+' logged')},

  pickMeal(d){openMealLog(S.meals.find(m=>m.id===d.id))},
  aunit(d){const a=ctx.amt;a.unit=d.u;a.val=d.u==='srv'?1:d.u==='oz'?4:100;$('#amt').value=a.val;$('#aunits').innerHTML=unitBtns();$('#aout').innerHTML=amtOut()},
  amtOk(){
    const g=amtGrams();if(g<=0)return toast('Enter an amount');const p=ctx.pick,f=ctx.amt.food;
    if(p.mode==='meal'){ctx.meal.items.push({foodId:f.id,g:r1(g)});drawMeal();return}
    day(ui.date).entries.push(mkEntry(f,r1(g),p.slot));save();closeSheet();render();toast('Added to '+p.slot);
  },
  mlScale(d){ctx.ml.items.forEach(i=>i.g=r1(i.base*+d.n));drawMealLog()},
  mlOk(){const l=ctx.ml,es=l.items.filter(i=>i.g>0).map(i=>mkEntry(food(i.foodId),i.g,ctx.pick.slot,l.meal.name));if(!es.length)return;day(ui.date).entries.push(...es);save();closeSheet();render();toast(l.meal.name+' added')},
  editEntry(d){openEntry(d.id)},
  entryOk(){const e=ctx.entry,g=num($('#eg').value);if(g<=0)return toast('Enter grams');const k=g/e.g;e.kcal*=k;e.p*=k;e.c*=k;e.f*=k;e.g=g;e.slot=$('#es').value;save();closeSheet();render()},
  entryDel(){const d=day(ui.date);d.entries=d.entries.filter(x=>x.id!==ctx.entry.id);save();closeSheet();render()},
  complete(){const d=day(ui.date);if(!d.complete&&!d.entries.length)return toast('Nothing logged for this day');d.complete=!d.complete;save();render()},
  copyPrev(){
    const ks=Object.keys(S.log).filter(k=>k<ui.date&&entries(k).length).sort();if(!ks.length)return toast('No earlier day to copy');
    const src=ks[ks.length-1];day(ui.date).entries.push(...entries(src).map(e=>cloneEntry(e)));save();render();toast('Copied '+niceDate(src));
  },
  saveW(d){
    const v=num($('#'+d.src).value),k=d.date?$('#'+d.date).value:ui.date;
    if(!k)return toast('Pick a date');
    if(!v){if(S.weights[k]!=null&&!d.date){delete S.weights[k];save();render();toast('Weight removed')}else toast('Enter a weight');return}
    const kg=fromDisp(v);if(kg<25||kg>320)return toast('That weight looks off');
    S.weights[k]=Math.round(kg*1000)/1000;save();render();toast('Weight saved');
  },
  delW(d,el){if(!twoTap(el.querySelector('.k'),'w'+d.k,'Tap to delete'))return;delete S.weights[d.k];save();render()},
  range(d){ui.range=+d.n;render()},
  goal(d){const T=S.targets;T.goal=d.g;save();render()},

    const T=S.targets;if(T.mode===d.m)return;
    if(d.m==='pct'){const k=T.p*4+T.c*4+T.f*9;if(k){T.pp=r0(T.p*400/k);T.pc=r0(T.c*400/k);T.pf=100-T.pp-T.pc}applyPct()}

  },

  newMeal(){openMeal(null)},
  newRecipe(){ctx.pick=null;openRecipe(null)},
  recipeOk(){
    syncMeal();const m=ctx.meal;m.name=m.name.trim();if(!m.name)return toast('Name the recipe');

      recipe:{items:m.items.map(i=>({foodId:i.foodId,g:i.g})),yield:m.yield>0?m.yield:0,portions:m.portions>0?m.portions:0}};
    const f=m.id&&food(m.id);if(f)Object.assign(f,v);else S.foods.push(Object.assign({id:uid()},v));
    save();ctx.meal=null;closeSheet();ui.seg='foods';render();toast('Recipe saved · '+fmt(v.kcal)+' kcal per 100 g');
  },
  recipeDel(d,el){if(!twoTap(el,'rd','Tap again to delete'))return;S.foods=S.foods.filter(f=>f.id!==ctx.meal.id);save();ctx.meal=null;closeSheet();render()},
  fitAdd(d){

  },
  fitOpen(d){
    ctx.pick={mode:'log',slot:slotNow(),tab:'recent',q:'',usda:[],msg:''};
    if(d.m)openMealLog(S.meals.find(x=>x.id===d.m),+d.s);else openAmount(food(d.f),+d.g);
  },
  copyWeek(){copyText(weekText(ui.week),'Week summary copied','Week summary')},
  saveGoalW(){
    const v=num($('#gw').value);
    if(!v){S.targets.goalKg=0;save();render();return toast('Goal weight cleared')}
    const kg=fromDisp(v);if(kg<25||kg>320)return toast('That weight looks off');
    S.targets.goalKg=Math.round(kg*1000)/1000;save();render();toast('Goal weight saved');
  },
  snaps(){openSnaps()},
  snapRestore(d,el){if(!twoTap(el.querySelector('.k'),'sn'+d.k,'Tap again'))return;const rec=(ui.snaps||[]).find(x=>x.k===d.k);if(rec)restoreSnap(rec)},
  recover(){if(ui.recover)restoreSnap(ui.recover)},
  recoverNo(){ui.recover=null;render()},
  editMeal(d){openMeal(S.meals.find(m=>m.id===d.id))},
  mealAdd(){syncMeal();openPicker('meal',null,'foods')},
  mealRm(d){syncMeal();ctx.meal.items.splice(+d.i,1);drawMeal()},
  mealOk(){
    syncMeal();const m=ctx.meal;m.name=m.name.trim();if(!m.name)return toast('Name the meal');
    m.items=m.items.filter(i=>i.g>0);if(!m.items.length)return toast('Add an ingredient');
    if(m.id)Object.assign(S.meals.find(x=>x.id===m.id),m);else S.meals.push({...m,id:uid()});
    save();ctx.meal=null;closeSheet();ui.seg='meals';render();
  },
  mealDel(d,el){if(!twoTap(el,'md','Tap again to delete'))return;S.meals=S.meals.filter(x=>x.id!==ctx.meal.id);save();ctx.meal=null;closeSheet();render()},
  async paste(){ // one button: Health lines import straight away, log lines open the preview
    let t='';try{t=await navigator.clipboard.readText()}catch(e){}
    const hs=t?readHealth(t):[],ls=t?parseLog(t,ui.date):[];
    if(hs.length&&!ls.length){const r=applyHealth(hs);render();return toast(healthMsg(r))}
    openPaste(ls.length?t:'');
    if(!ls.length)toast(t?'Clipboard has no log or Health lines':'Clipboard empty. Paste or type below');
  },
  plOk(){
    const txt=ctx.paste.text,items=parseLog(txt,ui.date).filter(i=>i.kind!=='err'),hs=readHealth(txt);if(!items.length&&!hs.length)return toast('Nothing to add');
    const hr=applyHealth(hs),r=commitLog(items),ks=[...new Set(items.map(i=>i.k))];if(ks.length===1)ui.date=ks[0];
    closeSheet();render();toast([r.n?'Added '+r.n+' item'+(r.n>1?'s':'')+(r.nf?' · '+r.nf+' new ingredient'+(r.nf>1?'s':''):''):'',hr.n||hr.w?healthMsg(hr):''].filter(Boolean).join(' · '));
  },
  async copyPrompt(){
    const p=logPrompt();
    try{await navigator.clipboard.writeText(p);toast('Prompt copied')}
    catch(e){if(!$('#pl'))openPaste('');const a=$('#pl');a.value=p;a.focus();a.select();toast('Copy the selected text')}
  },
  healthManual(){openHealthManual()},
  healthOk(){
    const pasted=$('#hp').value.trim();
    if(pasted){const r=parseHealth(pasted);if(!r.n&&!r.w)return toast('Could not read that text')}
    else{const k=$('#hd').value,a=num($('#ha').value),r=num($('#hr').value);if(!k||a+r<=0)return toast('Enter active and resting kcal');S.health[k]={active:r0(a),resting:r0(r)};save()}
    closeSheet();render();toast('Saved');
  },
  async export(){
    const prev=S.meta.lastBackup,done=()=>{save();render();toast('Backup saved')};
    S.meta.lastBackup=Date.now(); // stamped into the file too, so a restore knows its own age
    const name='fuel-backup-'+today()+'.json',blob=new Blob([JSON.stringify(S)],{type:'application/json'});
    try{const file=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return done()}}catch(e){if(e&&e.name==='AbortError'){S.meta.lastBackup=prev;return}}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();done();
  },
  import(){$('#imp').click()},
  async reset(d,el){if(!twoTap(el,'reset','Tap again to erase everything'))return;try{await snapshot('before erase')}catch(e){}localStorage.removeItem(LS);load();render();toast('Erased')}
};
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]');if(!el||el.disabled)return;const fn=A[el.dataset.a];if(fn)fn(el.dataset,el)});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='fq'){ui.q=t.value;$('#flist').innerHTML=foodsList()}
  else if(t.id==='pq'){ctx.pick.q=t.value;if(ctx.pick.tab!=='usda')$('#plist').innerHTML=pickerList()}
  else if(t.id==='pl'){ctx.paste.text=t.value;$('#plout').innerHTML=pasteOut()}
  else if(t.id==='amt'){ctx.amt.val=t.value;$('#aout').innerHTML=amtOut()}
  else if(t.dataset.ml!=null){ctx.ml.items[+t.dataset.ml].g=num(t.value);$('#mlout').innerHTML=mlOut()}
  else if(t.dataset.mi!=null||t.id==='ry'||t.id==='rp'){syncMeal();$('#mout').innerHTML=mealOut()} // totals update in place: a redraw here would swallow the tap on Save
});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='pq'&&ctx.pick&&ctx.pick.tab==='usda'){ev.preventDefault();usdaSearch()}});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='imp'&&t.files[0]){const rd=new FileReader();rd.onload=async()=>{let j;try{j=JSON.parse(rd.result);if(!Array.isArray(j.foods)||typeof j.log!=='object')throw 0}catch(e){return toast('Not a Fuel backup file')}try{await snapshot('before import')}catch(e){}S=j;save();load();render();toast('Backup restored')};rd.readAsText(t.files[0]);t.value='';return}
  if(t.dataset.mi!=null)return;
  if(!t.dataset.set)return;
  const[a,b]=t.dataset.set.split('.');
  S[a][b]=t.dataset.bool?t.value==='1':t.dataset.str?t.value.trim():num(t.value);save();
  if(a==='targets'&&b==='kcal'&&S.targets.goal!=='custom'){S.targets.goal='custom';save();render();return}
  if(a==='targets'){if(S.targets.mode==='pct'){applyPct();save()}const n=$('#macronote');if(n)n.textContent=targetNote()}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(snapT);snapshot().catch(()=>{})}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ui.tab==='today'&&!document.body.classList.contains('sheet')&&ui.date!==today()&&ui._seen!==today()){ui._seen=today();ui.date=today();render()}});

load();render();
(navigator.storage&&navigator.storage.persist?navigator.storage.persist().catch(()=>{}):Promise.resolve()).then(snapInfo);
if(fresh)snapList().then(sn=>{if(sn.length&&!hasData()){ui.recover=sn[0];if(ui.tab==='today'&&!document.body.classList.contains('sheet'))render()}}).catch(()=>{});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
